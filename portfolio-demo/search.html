<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lethe — Search</title>
<link rel="stylesheet" href="style.css" />
<style>
  .prompt-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .prompt-chip:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .prompt-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: -0.5rem 0 1.1rem;
  }
</style>
</head>
<body>
<div class="sidebar">
  <div>
    <a href="index.html" class="brand-link"><div class="brand-name">Lethe</div></a>
    <div class="brand-tag">Certified Forgetting</div>
  </div>
  <nav class="side-nav">
    <a href="overview.html">Overview</a>
    <a href="search.html" class="active">Search</a>
    <a href="erasure.html">Erasure Request</a>
    <a href="audit.html">Audit Trail</a>
    <a href="benchmarks.html">Benchmarks</a>
  </nav>
</div>
<main>
  <h1>Search demo</h1>
  <p class="subtitle">Semantic similarity search over one tenant's live documents.</p>

  <div class="panel">
    <div class="form-row">
      <select id="tenant-select">
        <option value="00000000-0000-0000-0000-000000000001">Tenant 1</option>
        <option value="00000000-0000-0000-0000-000000000002">Tenant 2</option>
      </select>
      <input type="text" id="query-text" placeholder="Type a query, or pick one below" />
      <button id="search-btn">Search</button>
    </div>
    <div class="prompt-row" id="prompt-row"></div>
    <div id="status" class="status-line"></div>
    <div id="results-table"></div>
  </div>
</main>
<script src="mock.js"></script>
<script>
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results-table");

const EXAMPLE_PROMPTS = [
  "repeated failed login attempts from an unfamiliar ip",
  "a large amount of outbound traffic to an external host",
  "an unrecognized process spawned on a host",
  "unusual access to a shared cloud storage bucket",
];

const promptRowEl = document.getElementById("prompt-row");
EXAMPLE_PROMPTS.forEach((prompt) => {
  const chip = document.createElement("button");
  chip.className = "prompt-chip";
  chip.textContent = prompt;
  chip.addEventListener("click", () => {
    document.getElementById("query-text").value = prompt;
    runSearch();
  });
  promptRowEl.appendChild(chip);
});

async function runSearch() {
  const tenantId = document.getElementById("tenant-select").value;
  const queryText = document.getElementById("query-text").value.trim();

  if (!queryText) {
    statusEl.textContent = "Type something to search for.";
    return;
  }

  statusEl.textContent = "Searching...";
  resultsEl.innerHTML = "";

  try {
    const results = await postJSON("/search", { tenant_id: tenantId, query_text: queryText, k: 10 });
    statusEl.textContent = `${results.length} results`;

    renderTable(resultsEl, ["#", "Similarity", "Content"], results, (r) => {
      const tr = document.createElement("tr");
      const similarity = (1 - r.distance).toFixed(3);
      tr.appendChild(td(results.indexOf(r) + 1));
      tr.appendChild(tdMono(similarity));
      tr.appendChild(td(r.content));
      return tr;
    });
  } catch (err) {
    statusEl.textContent = "Search failed: " + err.message;
  }
}

document.getElementById("search-btn").addEventListener("click", runSearch);
document.getElementById("query-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    runSearch();
  }
});
</script>
</body>
</html>
