<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lethe — Deletion Certificate</title>
<link rel="stylesheet" href="style.css" />
<style>
@media print {
  .sidebar, .no-print { display: none; }
  body { background: #fff; color: #000; display: block; }
  main { max-width: 100%; padding: 0; }
  .panel { background: #fff; border-color: #ccc; }
  th, td { border-color: #ccc; }
  .badge.good::before { background: #000; }
  .badge.good { color: #000; }
}
</style>
</head>
<body>
<div class="sidebar no-print">
  <div>
    <a href="index.html" class="brand-link"><div class="brand-name">Lethe</div></a>
    <div class="brand-tag">Certified Forgetting</div>
  </div>
  <nav class="side-nav">
    <a href="overview.html">Overview</a>
    <a href="search.html">Search</a>
    <a href="erasure.html">Erasure Request</a>
    <a href="audit.html">Audit Trail</a>
    <a href="benchmarks.html">Benchmarks</a>
  </nav>
</div>
<main>
  <h1>Deletion certificate</h1>
  <p class="subtitle">Proof that a specific erasure request completed: every document it removed, each one's content hash and signature, so a reader can independently re-run verification against this record.</p>

  <div class="panel">
    <button class="no-print" id="print-btn">Print / save as PDF</button>
    <div id="certificate-body"></div>
  </div>
</main>
<script src="mock.js"></script>
<script>
document.getElementById("print-btn").addEventListener("click", () => window.print());

function field(label, value, mono) {
  const row = document.createElement("p");
  const strong = document.createElement("strong");
  strong.textContent = label + ": ";
  row.appendChild(strong);

  if (mono) {
    const span = document.createElement("span");
    span.className = "mono";
    span.textContent = value;
    row.appendChild(span);
  } else {
    row.appendChild(document.createTextNode(value));
  }

  return row;
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get("request_id");
  const container = document.getElementById("certificate-body");

  if (!requestId) {
    container.textContent = "No request_id given in the URL.";
    return;
  }

  try {
    const cert = await getJSON(`/deletion-requests/${requestId}/certificate`);

    container.innerHTML = "";
    container.appendChild(field("Deletion request", cert.deletion_request_id, true));
    container.appendChild(field("Subject", cert.subject_id, true));
    container.appendChild(field("Requested at", new Date(cert.requested_at).toLocaleString()));
    container.appendChild(field("Completed at", cert.completed_at ? new Date(cert.completed_at).toLocaleString() : "n/a"));

    const table = document.createElement("div");
    renderTable(
      table,
      ["Document ID", "Content hash", "Previous hash", "Signature", "Signed at"],
      cert.audit_entries,
      (entry) => {
        const tr = document.createElement("tr");
        tr.appendChild(tdMono(entry.document_id));
        tr.appendChild(tdMono(entry.hash));
        tr.appendChild(tdMono(entry.previous_hash));
        tr.appendChild(tdMono(entry.signature));
        tr.appendChild(tdMono(entry.signed_at));
        return tr;
      }
    );
    container.appendChild(table);
  } catch (err) {
    container.textContent = "Failed to load certificate: " + err.message;
  }
}

load();
</script>
</body>
</html>
