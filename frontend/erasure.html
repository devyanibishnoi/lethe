<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lethe — Erasure Request</title>
<link rel="stylesheet" href="style.css" />
<style>
  .step-list {
    margin-top: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-left: 2px solid var(--border);
    padding-left: 1rem;
    margin-left: 7px;
    color: var(--text-faint);
    font-size: 0.88rem;
    transition: color 0.2s, border-color 0.2s;
  }

  .step:last-child { border-left-color: transparent; }

  .step .step-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: -1.9rem;
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    transition: border-color 0.2s, background 0.2s;
  }

  .step.active { color: var(--text); border-left-color: var(--accent); }
  .step.active .step-dot { border-color: var(--accent); background: var(--accent); animation: pulse 0.9s infinite; }

  .step.done { color: var(--text); border-left-color: var(--good); }
  .step.done .step-dot { border-color: var(--good); background: var(--good); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="sidebar">
  <div>
    <a href="index.html" class="brand-link"><div class="brand-name">Lethe</div></a>
    <div class="brand-tag">Certified Forgetting</div>
  </div>
  <nav class="side-nav">
    <a href="overview.html">Overview</a>
    <a href="search.html">Search</a>
    <a href="erasure.html" class="active">Erasure Request</a>
    <a href="audit.html">Audit Trail</a>
    <a href="benchmarks.html">Benchmarks</a>
  </nav>
</div>
<main>
  <h1>Submit an erasure request</h1>
  <p class="subtitle">Pick a subject, submit a request, then process it, this cascades to every document that subject has, across both tenants.</p>

  <div class="panel">
    <div class="form-row">
      <select id="subject-select"></select>
      <button id="submit-btn">Submit deletion request</button>
    </div>
    <div id="status" class="status-line"></div>
    <div class="step-list" id="step-list"></div>
    <div id="certificate-link"></div>
  </div>
</main>
<script src="app.js"></script>
<script>
const subjectSelect = document.getElementById("subject-select");
const statusEl = document.getElementById("status");
const stepListEl = document.getElementById("step-list");
let subjectsById = {};

async function loadSubjects() {
  try {
    const subjects = await getJSON("/subjects");
    subjectsById = Object.fromEntries(subjects.map((s) => [s.subject_id, s]));
    subjectSelect.innerHTML = "";
    subjects.forEach((s) => {
      const option = document.createElement("option");
      option.value = s.subject_id;
      option.textContent = `${s.display_name} (${tenantLabel(s.tenant_id)}, ${s.document_count} docs)`;
      subjectSelect.appendChild(option);
    });
  } catch (err) {
    statusEl.textContent = "Failed to load subjects: " + err.message;
  }
}

const certificateLinkEl = document.getElementById("certificate-link");

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function buildSteps(labels) {
  stepListEl.innerHTML = "";
  return labels.map((label) => {
    const step = document.createElement("div");
    step.className = "step";
    step.innerHTML = `<div class="step-dot"></div><div>${label}</div>`;
    stepListEl.appendChild(step);
    return step;
  });
}

document.getElementById("submit-btn").addEventListener("click", async () => {
  const subjectId = subjectSelect.value;
  if (!subjectId) return;

  const subject = subjectsById[subjectId];
  certificateLinkEl.innerHTML = "";
  statusEl.textContent = "";

  const steps = buildSteps([
    "Deletion request submitted",
    `Locating ${subject.document_count} document(s) for "${subject.display_name}" across tenants`,
    "Hard-deleting each document and rebuilding its partition",
    "Signing and hash-chaining an audit entry per deletion",
    "Erasure complete",
  ]);

  try {
    steps[0].className = "step active";
    const request = await postJSON("/deletion-requests", { subject_id: subjectId });
    steps[0].className = "step done";
    steps[1].className = "step active";
    await sleep(350);

    steps[1].className = "step done";
    steps[2].className = "step active";

    const processedPromise = postJSON(`/deletion-requests/${request.deletion_request_id}/process`);
    await sleep(500);
    if (steps[2].className === "step active") {
      steps[2].className = "step done";
      steps[3].className = "step active";
    }

    const processed = await processedPromise;

    steps[2].className = "step done";
    steps[3].className = "step done";
    steps[4].className = "step done";

    statusEl.textContent = `Request ${processed.deletion_request_id} is now ${processed.status}.`;

    const link = document.createElement("a");
    link.href = `certificate.html?request_id=${processed.deletion_request_id}`;
    link.className = "cert-link";
    link.textContent = "View deletion certificate →";
    certificateLinkEl.appendChild(link);

    loadSubjects();
  } catch (err) {
    statusEl.textContent = "Erasure failed: " + err.message;
  }
});

loadSubjects();
</script>
</body>
</html>
